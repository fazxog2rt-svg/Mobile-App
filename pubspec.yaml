name: discord_bot_manager
description: Discord Bot Management App
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.3
  retrofit: ^4.1.0
  web_socket_channel: ^2.4.5

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  fl_chart: ^0.67.0

  # Biometric
  local_auth: ^2.1.8

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Utils
  intl: ^0.20.0
  timeago: ^3.6.1
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0

  # Image
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # assets:  # Uncomment when asset files are added
  #   - assets/images/
  #   - assets/animations/
  #   - assets/icons/
  # fonts:  # Uncomment and add Poppins TTF files to assets/fonts/ to enable
